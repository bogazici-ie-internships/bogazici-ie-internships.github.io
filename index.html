<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Google reads the site name and favicon from this domain-root page, not from /staj/.
       Keep the WebSite block in sync with staj repo → overrides/main.html. -->
  <title>Boğaziçi EM Zorunlu Staj</title>
  <meta name="description" content="Boğaziçi Üniversitesi Endüstri Mühendisliği zorunlu staj kılavuzu: tarihler, süreç, formlar, rapor teslimi ve iletişim.">
  <link rel="canonical" href="https://bogazici-ie-internships.github.io/">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
  <link rel="apple-touch-icon" href="/favicon-192.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Boğaziçi EM Zorunlu Staj">
  <meta property="og:title" content="Boğaziçi EM — Zorunlu Staj Kılavuzu">
  <meta property="og:url" content="https://bogazici-ie-internships.github.io/">
  <meta property="og:image" content="https://bogazici-ie-internships.github.io/staj/assets/og-image.png">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Boğaziçi EM Zorunlu Staj",
    "alternateName": ["Boğaziçi Endüstri Mühendisliği Zorunlu Staj", "Boğaziçi IE Compulsory Internship"],
    "url": "https://bogazici-ie-internships.github.io/",
    "publisher": {
      "@type": "Organization",
      "name": "Boğaziçi Üniversitesi Endüstri Mühendisliği Bölümü",
      "url": "https://ie.bogazici.edu.tr/",
      "logo": "https://bogazici-ie-internships.github.io/favicon-512.png"
    }
  }
  </script>
  <style>
    :root { --bg: #f7f7fb; --fg: #1a1c2e; --muted: #5a5f7a; --accent: #3f51b5; --card: #fff; --line: #e3e5ef; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14151f; --fg: #e8e9f2; --muted: #a2a6c0; --accent: #8c9eff; --card: #1d1f2c; --line: #2c2f42; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
           background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 440px; width: 100%; background: var(--card); border: 1px solid var(--line);
           border-radius: 12px; padding: 32px 28px; text-align: center; }
    img { width: 72px; height: 72px; background: #fff; border-radius: 50%; }
    h1 { font-size: 1.4rem; margin: 16px 0 4px; }
    p { margin: 0 0 24px; color: var(--muted); }
    a.btn { display: block; padding: 12px 16px; border-radius: 8px; background: var(--accent); color: #fff;
            text-decoration: none; font-weight: 600; }
    @media (prefers-color-scheme: dark) { a.btn { color: #14151f; } }
    a.alt { display: inline-block; margin-top: 14px; color: var(--accent); font-size: .95rem; }
  </style>
</head>
<body>
  <main>
    <img src="/favicon.svg" alt="Boğaziçi Üniversitesi">
    <h1>Zorunlu Staj Kılavuzu</h1>
    <p>Boğaziçi Üniversitesi Endüstri Mühendisliği</p>
    <a class="btn" href="/staj/">Kılavuza git →</a>
    <a class="alt" href="/staj/en/" lang="en">Compulsory Internship Guide (English)</a>
  </main>
</body>
</html>
